[project]
name = "instaloader-tests"
version = "0.1.0"
description = "Instagram-backed integration tests for Instaloader"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "instaloader~=4.15",
  "pytest~=9.1",
]

[project.optional-dependencies]
dev = [
  "black~=26.5",
  "mypy~=2.3",
]

[tool.poetry]
package-mode = false

[tool.black]
target-version = ["py313"]

[tool.mypy]
files = ["tests"]
namespace_packages = true
python_version = "3.13"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["instaloader", "instaloader.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = ["-ra", "--tb=line", "-v", "--no-fold-skipped"]
testpaths = ["tests"]
markers = [
  "integration: test requires live Instagram access",
  "importance(level): run only when the configured maximum importance includes this level",
  "requirement_id(id): trace a test to an requirement in tests/support/requirements_map.py",
  "anonymous: test covers anonymous Instagram access",
  "logged_in: test covers logged-in Instagram access",
]
