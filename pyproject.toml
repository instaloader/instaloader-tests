[build-system]
requires = ["setuptools~=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "instaloader-tests"
version = "0.1.0"
description = "Instagram-backed integration tests for Instaloader"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "instaloader~=4.15",
  "pytest~=9.1",
]

[project.optional-dependencies]
dev = [
  "black~=26.5",
  "mypy~=2.3",
]

[tool.setuptools]
py-modules = []

[tool.black]
target-version = ["py314"]

[tool.mypy]
files = ["tests"]
namespace_packages = true
python_version = "3.14"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["instaloader", "instaloader.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = ["-ra", "--tb=line", "-v"]
testpaths = ["tests"]
markers = [
  "integration: test requires live Instagram access",
  "importance(level): run only when the configured maximum importance includes this level",
  "requirement_id(id): trace a test to an entry in instaloader-requirements.md",
  "anonymous: test covers anonymous Instagram access",
  "logged_in: test covers logged-in Instagram access",
]
